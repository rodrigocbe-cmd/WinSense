      <stop offset="0" stop-color="#3D5AFE"/>
      <stop offset="1" stop-color="#00BFD8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#ws-bg)"/>
  <!-- "Win": three window panes -->
  <rect x="26" y="26" width="34" height="34" rx="7" fill="#fff"/>
  <rect x="68" y="26" width="34" height="34" rx="7" fill="#fff" fill-opacity=".85"/>
